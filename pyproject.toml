[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ggufpeek"
version = "0.1.0"
description = "Inspect a GGUF model file's header, metadata, and tensor table without loading it — architecture, quantization, context length, and a per-type tensor breakdown."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nirry" }]
keywords = ["gguf", "llama.cpp", "llm", "model", "quantization", "metadata", "inference", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Utilities",
]

[project.scripts]
ggufpeek = "ggufpeek.cli:main"

[project.urls]
Homepage = "https://nirry.net"
Source = "https://github.com/nirry-dev/ggufpeek"

[tool.hatch.build.targets.wheel]
packages = ["ggufpeek"]
